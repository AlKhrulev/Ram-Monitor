name: Build macOS app

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install just
        run: brew install just
      - name: Build app
        run: just build
      - name: Zip app
        run: ditto -c -k --sequesterRsrc --keepParent "build/RAM Monitor.app" "build/RAM Monitor.zip"
      - name: Publish GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" "build/RAM Monitor.zip" --verify-tag --title "$TAG"
      - name: Upload zip for manual runs
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: RAM-Monitor-macOS-arm64
          path: build/RAM Monitor.zip
          if-no-files-found: error
